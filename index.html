<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo Mobile Resources</title>
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--daisyUI cdn-->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="bg-[#f4f5f7] h-[100vh] flex justify-center items-center">
    <form class="w-[350px] bg-white rounded-xl p-7">
      <div>
        <label class="font-semibold" for="">Mobile Number</label>
        <br>
        <input type="text" placeholder="EnterMobile Number" class="input bg-[#f4f5f7]" rounded-xl/>
      </div>
      <div class="mt-5">
        <label class="font-semibold" for="">4 Digit Pin</label>
        <br>
        <input type="text" placeholder="Enter 4 Digit Pin" class="input bg-[#f4f5f7] mt-3 rounded-xl" />
      </div>
      <button class="btn bg-[#0874F2] text-white mt-5 w-full rounded-xl">Login</button>

    
    </form>
  </body>
</html>
